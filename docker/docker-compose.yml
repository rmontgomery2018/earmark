services:
  backend:
    image: earmark-backend
    container_name: earmark-backend
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: backend
    env_file: ../.env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/earmark.db
      ALIGNMENT_CACHE_DIR: /app/data/cache
    volumes:
      - earmark-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7700/healthcheck', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    image: earmark-frontend
    container_name: earmark-frontend
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: frontend
    env_file: ../.env
    environment:
      BACKEND_URL: http://backend:7700
      ORIGIN: ${ORIGIN:-http://localhost:7070}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:alpine
    container_name: earmark-nginx
    ports:
      - "${PORT:-7070}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  earmark-data:
